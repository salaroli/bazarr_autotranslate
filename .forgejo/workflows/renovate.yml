name: renovate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: docker-ci
    steps:
      - name: Run Renovate
        run: |
          docker run --rm \
            -e RENOVATE_PLATFORM=gitea \
            -e RENOVATE_ENDPOINT="http://192.168.1.2:3000/" \
            -e RENOVATE_TOKEN="${{ secrets.RENOVATE_TOKEN }}" \
            -e RENOVATE_AUTODISCOVER=false \
            -e RENOVATE_REPOSITORIES=salaroli/bazarr_autotranslate \
            -e RENOVATE_GIT_AUTHOR="Renovate Bot <renovate@localhost>" \
            renovate/renovate:latest
