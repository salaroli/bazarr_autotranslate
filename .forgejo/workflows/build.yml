name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  pull_request:

env:
  REGISTRY: forgejo.salaro.li

permissions:
  contents: read

jobs:
  build:
    runs-on: docker-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # buildx ja vem pre-instalado na imagem docker-ci, so falta configurar
      # o builder em runtime. --buildkitd-config, NUNCA --config (flag global
      # do docker CLI, corrompe o estado do buildx entre este comando e o
      # `inspect --bootstrap` seguinte).
      - name: Configura o buildx
        run: |
          # Registro HTTPS (forgejo.salaro.li) desde 2026-09-06 — dispensa o
          # buildkitd.toml com http=true do registro HTTP legado. Builder velho
          # retém config antiga: se o push falhar com "HTTP response to HTTPS
          # client", docker rm -f do buildx_buildkit_* no runner (padrao-cicd.md).
          docker buildx create --name ci-bazarr-autotranslate --driver docker-container --use
          docker buildx inspect --bootstrap

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Sem cache-from/cache-to de registro: bug de concorrencia conhecido no
      # registro de containers do Forgejo (panic em EndUploadBlob quando dois
      # uploads paralelos terminam o mesmo digest).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/salaroli/bazarr-autotranslate:latest
            ${{ env.REGISTRY }}/salaroli/bazarr-autotranslate:${{ steps.sha.outputs.short }}
